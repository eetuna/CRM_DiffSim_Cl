name: Nightly Tests

on:
  schedule:
    # Run at 2 AM UTC every day
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  nightly-regression:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake g++ libeigen3-dev python3 python3-pip
        pip3 install numpy pybind11

    - name: Configure CMake (Release)
      run: |
        mkdir -p build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: |
        cd build
        make -j$(nproc) CRMCPPLib test_straight_rod test_li_sweep crm_diff_py

    - name: Run Straight-Rod Physics Tests (PHASE C)
      run: |
        cd build
        ctest --output-on-failure -R straight_rod_physics

    - name: Run Li Sweep Baseline (straight mode)
      run: |
        cd build
        ./test_li_sweep
      continue-on-error: true

    - name: Run Li Sweep Smoke Test (Python)
      if: always()
      run: |
        python3 python/test_li_sweep_smoke.py
      env:
        PYTHONPATH: ${{ github.workspace }}/build
      continue-on-error: true

    - name: Upload Li Sweep Results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: li-sweep-results
        path: |
          li_sweep_*.csv
        retention-days: 30

    - name: Summary
      if: success()
      run: |
        echo "✓ All nightly tests passed"
        echo "  - Straight-rod physics: PASS"
        echo "  - Li sweep baseline: PASS"
