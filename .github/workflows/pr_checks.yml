name: PR Checks

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake g++ libeigen3-dev python3 python3-pip
        pip3 install numpy pybind11 torch

    - name: Configure CMake (Release)
      run: |
        mkdir -p build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: |
        cd build
        make -j$(nproc) CRMCPPLib test_golden_backward test_cp15_harness test_cp31_linearization crm_diff_py

    - name: Run Golden Backward Test (PHASE A)
      run: |
        cd build
        ctest --output-on-failure -R golden_backward

    - name: Run C++ Reference Harness
      run: |
        cd build
        ctest --output-on-failure -R cpp_reference_harness

    - name: Run C++ <-> Python Smoke Gate (PHASE B)
      run: |
        cd build
        ctest --output-on-failure -R cpp_python_smoke
      env:
        PYTHONPATH: ${{ github.workspace }}/build

    - name: Run CP2.x Dynamics Fast Gate (CP2.1-CP2.3)
      run: |
        cd build
        ctest --output-on-failure -R "dynamics_smoke_cp21|dynamics_fd_cp22|dynamics_smoke_cp23_python"
      env:
        PYTHONPATH: ${{ github.workspace }}/build

    - name: Run CP3.1 Linearization Fast Gate
      run: |
        cd build
        ctest --output-on-failure -R "test_cp31_linearization_cpp|dynamics_linearization_cp31_python"
      env:
        PYTHONPATH: ${{ github.workspace }}/build:${{ github.workspace }}/python

    - name: Upload test logs on failure
      if: failure()
      uses: actions/upload-artifact@v3
      with:
        name: pr-test-logs
        path: |
          build/Testing/Temporary/LastTest.log
          build/Testing/Temporary/*.log

    - name: Summary
      if: success()
      run: |
        echo "✓ All PR checks passed"
        echo "  - Golden backward test: PASS"
        echo "  - C++ <-> Python smoke gate: PASS"
        echo "  - CP2.x dynamics fast gate (CP2.1-CP2.3): PASS"
        echo "  - CP3.1 linearization fast gate (C++ + Python): PASS"
